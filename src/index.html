<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Haven</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!--
    Self-hosted fonts (public/fonts, license in OFL.txt). Declared here rather than in
    styles.css so the URLs resolve against <base href> on GitHub Pages instead of being
    bundled by the build. Each file is a variable font covering the weights listed.
  -->
  <link rel="preload" href="fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'DM Sans';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url('fonts/dm-sans.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Fraunces';
      font-style: normal;
      font-weight: 300 600;
      font-display: swap;
      src: url('fonts/fraunces.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Fraunces';
      font-style: italic;
      font-weight: 300 500;
      font-display: swap;
      src: url('fonts/fraunces-italic.woff2') format('woff2');
    }
  </style>
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
