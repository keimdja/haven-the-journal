<aside class="flex h-full w-58 flex-col gap-8 border-r border-hairline bg-cream px-5 pt-9 pb-7">
  <a class="flex rounded-lg px-3 no-underline" routerLink="/">
    <app-brand-mark size="md" [tagline]="true" />
  </a>

  <nav class="flex flex-col gap-0.5" aria-label="Main">
    @for (item of items; track item.path) {
      <a
        class="flex h-11 items-center gap-3 rounded-lg px-3 font-medium text-ink-muted no-underline transition-colors not-aria-[current=page]:hover:bg-cream-deep aria-[current=page]:bg-sage-tint aria-[current=page]:font-semibold aria-[current=page]:text-olive-ink"
        [routerLink]="item.path"
        routerLinkActive
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: item.exact }"
      >
        <app-icon [name]="item.icon" [size]="19" />
        {{ item.label }}
      </a>
    }
  </nav>

  <p class="mx-3 mt-auto text-meta text-ink-soft">Your entries are private to your account.</p>
</aside>
