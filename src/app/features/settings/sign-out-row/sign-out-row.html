<button
  app-settings-row
  [label]="t().settings.signOut"
  [disabled]="busy()"
  (click)="start()"
></button>

<app-bottom-sheet [heading]="t().settings.signOutWarning.heading" [alert]="true" [(open)]="warning">
  <p class="text-ink-muted">{{ t().settings.signOutWarning.body }}</p>
  <div class="mt-2.5 grid grid-cols-2 gap-2.5">
    <button appButton="secondary" autofocus [wide]="true" (click)="warning.set(false)">
      {{ t().settings.signOutWarning.stay }}
    </button>
    <button appButton="danger" [wide]="true" (click)="confirm()">
      {{ t().settings.signOutWarning.confirm }}
    </button>
  </div>
</app-bottom-sheet>
