<header class="flex shrink-0 flex-col gap-1.5 px-3 pt-[calc(env(safe-area-inset-top)+0.5rem)]">
  <div class="flex items-center justify-between">
    <a class="flex items-center gap-1.5 p-3 font-medium text-ink no-underline" routerLink="/">
      <app-icon name="close" [size]="18" />
      {{ t().reflect.saveExit }}
    </a>
    <p class="p-3 text-meta text-ink-soft">
      {{ t().reflect.part }} {{ step() }} {{ t().entry.ofSix }}
    </p>
  </div>
  <app-stage-bar class="px-3" [current]="step()" [label]="t().reflect.progress" />
</header>

<main class="flex min-h-0 flex-1 flex-col overflow-y-auto px-6 pt-6.5">
  <ng-content />
</main>

<footer
  class="flex shrink-0 items-center gap-2 border-t border-hairline px-5 pt-3 pb-[calc(1.875rem+env(safe-area-inset-bottom))]"
>
  @if (backLink(); as back) {
    <a appButton="quiet" [routerLink]="back">
      <app-icon name="arrow-left" [size]="18" />
      {{ t().reflect.back }}
    </a>
  }
  <a
    class="ml-auto px-2.5 py-3 text-sm font-medium text-ink-soft no-underline"
    [routerLink]="nextLink()"
  >
    {{ t().reflect.skip }}
  </a>
  <a appButton [routerLink]="nextLink()">{{ t().reflect.continue }}</a>
</footer>
