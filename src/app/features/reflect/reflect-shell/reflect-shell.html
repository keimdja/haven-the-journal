<header
  class="flex shrink-0 flex-col gap-1.5 px-3 pt-[calc(env(safe-area-inset-top)+0.5rem)] lg:border-b lg:border-hairline lg:px-10 lg:py-4.5"
>
  <div class="flex items-center justify-between gap-6">
    <a class="flex items-center gap-1.5 p-3 font-medium text-ink no-underline" routerLink="/">
      <app-icon name="close" [size]="18" />
      {{ t().reflect.saveExit }}
    </a>
    <p class="hidden font-reflect text-[17px] lg:block">
      {{ entry().title || t().entry.untitled }}
    </p>
    <app-save-status class="px-3 max-lg:hidden" [state]="sync.state()" (retry)="sync.run()" />
    <p class="p-3 text-meta text-ink-soft lg:hidden">
      {{ t().reflect.part }} {{ step() }} {{ t().entry.ofSix }}
    </p>
  </div>
  <app-stage-bar class="px-3 lg:hidden" [current]="step()" [label]="t().reflect.progress" />
</header>

<div
  class="flex min-h-0 flex-1 flex-col lg:mx-auto lg:w-full lg:max-w-[1240px] lg:flex-row lg:gap-24 lg:px-[72px] lg:pt-14 lg:pb-16"
>
  <app-parts-toc class="hidden w-[260px] shrink-0 lg:block" [entry]="entry()" [step]="step()" />

  <div class="flex min-h-0 flex-1 flex-col lg:max-w-[680px]">
    <p class="mb-3.5 hidden text-meta text-ink-soft lg:block">
      {{ t().reflect.part }} {{ step() }} {{ t().entry.ofSix }}
    </p>

    <main
      class="flex min-h-0 flex-1 flex-col overflow-y-auto px-6 pt-6.5 lg:overflow-visible lg:p-0"
    >
      <ng-content />
    </main>

    <footer
      class="flex shrink-0 items-center gap-2 border-t border-hairline px-5 pt-3 pb-[calc(1.875rem+env(safe-area-inset-bottom))] lg:border-0 lg:px-0 lg:pt-1.5 lg:pb-0"
    >
      @if (backLink(); as back) {
        <a appButton="quiet" [routerLink]="back">
          <app-icon name="arrow-left" [size]="18" />
          {{ t().reflect.back }}
        </a>
      }
      <a
        class="ml-auto px-2.5 py-3 text-sm font-medium text-ink-soft no-underline"
        [routerLink]="nextLink()"
      >
        {{ t().reflect.skip }}
      </a>
      <a appButton [routerLink]="nextLink()">{{ t().reflect.continue }}</a>
    </footer>
  </div>
</div>
