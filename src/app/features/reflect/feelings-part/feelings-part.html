<div class="flex flex-col gap-2.5">
  <h1 class="font-reflect text-question lg:text-[40px] lg:leading-[1.12]">{{ question() }}</h1>
  <p class="text-prompt text-ink-soft lg:text-base lg:leading-[1.6]">{{ helper() }}</p>
</div>

<app-feeling-picker
  [alwaysOpen]="true"
  [(feelings)]="feelings"
  [(customFeelings)]="customFeelings"
/>

<div class="flex flex-col gap-1.5">
  <label class="text-meta font-medium text-ink-muted" for="feelings-note">
    {{ t().reflect.feelingsNote }}
  </label>
  <div
    class="flex min-h-32 rounded-xl border border-page-line bg-paper px-4.5 pt-4.5 pb-3 transition-[border-color,box-shadow] focus-within:border-sage focus-within:ring-3 focus-within:ring-sage-tint"
  >
    <textarea
      #page
      id="feelings-note"
      class="w-full flex-1 resize-none bg-transparent font-reflect text-writing focus-visible:outline-none"
      [placeholder]="t().reflect.placeholder"
      [value]="note()"
      (input)="note.set(page.value)"
    ></textarea>
  </div>
</div>
