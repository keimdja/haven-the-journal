<div
  class="flex flex-col gap-7.5 px-6 pt-15 lg:gap-10 lg:px-[clamp(1.5rem,6vw,5.5rem)] lg:pt-16 lg:pb-18"
>
  <header class="flex flex-col gap-2.5 lg:gap-3">
    <app-brand-mark class="mb-3 lg:hidden" />
    <p class="text-label font-medium text-ink-soft uppercase">{{ date() }}</p>
    <h1 class="font-reflect text-greeting lg:text-display">{{ hello() }}</h1>
    <p class="text-base text-ink-soft lg:text-[17px]">{{ t().home.sub }}</p>
  </header>

  <app-start-options />

  @if (draft(); as draft) {
    <app-resume-card [entry]="draft" />
  }

  @if (recent().length > 0) {
    <section class="flex flex-col gap-1" aria-labelledby="recent-heading">
      <div class="flex items-baseline justify-between">
        <h2 id="recent-heading" appSectionLabel>{{ t().home.recent }}</h2>
        <a class="py-2.5 text-sm font-medium no-underline" routerLink="/journal">
          {{ t().home.seeAll }}
        </a>
      </div>
      <div class="flex flex-col">
        @for (entry of recent(); track entry.id) {
          <a
            app-entry-row
            [routerLink]="link(entry)"
            [date]="entry.writtenAt"
            [title]="entry.title"
            [preview]="preview(entry)"
            [kind]="entry.kind"
            [hidePreview]="hidePreviews()"
          ></a>
        }
      </div>
    </section>
  }
</div>
