<section class="flex flex-col gap-2.5" aria-labelledby="resume-heading">
  <h2 id="resume-heading" appSectionLabel>{{ t().home.resume }}</h2>
  <div class="flex items-center gap-4 border-b border-hairline pt-1 pb-3.5">
    <div class="flex min-w-0 flex-1 flex-col gap-1.75">
      <span class="font-reflect text-entry-title">{{ entry().title || t().entry.untitled }}</span>
      <span class="flex items-center gap-2.5 text-meta text-ink-soft">
        <app-six-dots [filled]="part()" />
        <span>
          {{ t().entry.kind.reflection }} · {{ part() }} {{ t().entry.ofSix }} · {{ weekday() }}
        </span>
      </span>
    </div>
    <a class="px-1 py-3 text-sm font-semibold no-underline" [routerLink]="link()">
      {{ t().reflect.continue }}
    </a>
  </div>
</section>
